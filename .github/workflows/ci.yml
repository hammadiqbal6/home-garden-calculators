name: CI

on:
  pull_request:
  push:
    branches: [main]

# Public build-time URLs (same pattern as Cloudflare Workers Builds variables).
# This site's origin: leave PUBLIC_SITE_URL unset so Astro uses DEFAULT_SITE_URL
# from src/config/site-origin.mjs (single fallback). Custom domain: set PUBLIC_SITE_URL
# in the dashboard / here — see docs/CUSTOM-DOMAIN.md. Do not paste workers.dev in app code.
env:
  PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_BUSINESS_DOCS: https://business-document-generators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev

jobs:
  build-test-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Link check
        run: npm run check:links
      - name: Audits (SEO, AdSense, perf, page checklist)
        run: npm run audit
      - name: Lighthouse CI
        run: npm run lighthouse
        continue-on-error: true

  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
      - name: Regenerate proof bundle
        run: npm run proof
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docs-proof
          path: docs/proof/
          if-no-files-found: warn
