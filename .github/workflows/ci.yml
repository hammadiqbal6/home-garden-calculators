name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public build-time URLs (same pattern as Cloudflare Workers Builds variables).
# Defaults also live in src/config/siteDefaults.mjs. See docs/CUSTOM-DOMAIN.md.
env:
  PUBLIC_SITE_URL: https://getyardtally.com
  PUBLIC_SITE_NAME: YardTally
  PUBLIC_SITE_SHORT_NAME: YardTally
  PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_BUSINESS_DOCS: https://docuklin.com
  PUBLIC_SITE_URL_HOME_GARDEN: https://getyardtally.com
  PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev

jobs:
  # Keep this job name: branch protection / required checks may reference it.
  build-test-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
