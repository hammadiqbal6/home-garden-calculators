name: Full checks

# Manual-only suite: link check, SEO/AdSense/perf/pages audits, Lighthouse, and proof.
# Run locally before PRs; trigger here from Actions → Full checks → Run workflow.
# Two jobs stay parallel (each installs once). A shared build artifact would add a
# serial install+build prefix and usually worsen wall time when install dominates.
on:
  workflow_dispatch:

concurrency:
  group: full-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://getyardtally.com
  PUBLIC_SITE_NAME: YardTally
  PUBLIC_SITE_SHORT_NAME: YardTally
  PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_BUSINESS_DOCS: https://docuklin.com
  PUBLIC_SITE_URL_HOME_GARDEN: https://getyardtally.com
  PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
  PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev

jobs:
  audit-lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Astro / Vite build caches
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
            node_modules/.astro
          key: astro-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-node22-
      - name: Build
        run: npm run build
      - name: Link check
        run: npm run check:links
      - name: Audits (SEO, AdSense, perf, page checklist)
        run: npm run audit
      - name: Lighthouse CI
        run: npm run lighthouse
        continue-on-error: true

  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Astro / Vite build caches
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
            node_modules/.astro
          key: astro-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-node22-
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        timeout-minutes: 5
        # ubuntu-24.04 already ships the system libs; skip --with-deps (apt is slow).
        # Only Chromium (not Firefox/WebKit). Cache hit skips re-download.
        run: npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Regenerate proof bundle
        run: npm run proof
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docs-proof
          path: docs/proof/
          if-no-files-found: warn
