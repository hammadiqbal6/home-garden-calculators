<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
  <title>Sonotube form dimensions</title>
  <desc>Round cardboard form labeled inside diameter and height.</desc>
  <rect width="960" height="540" fill="#f3f6f2"/>
  <ellipse cx="420" cy="120" rx="100" ry="30" fill="#efe6d6" stroke="#1f6b4a" stroke-width="4"/>
  <path d="M320 120 V400" stroke="#1f6b4a" stroke-width="4" fill="none"/>
  <path d="M520 120 V400" stroke="#1f6b4a" stroke-width="4" fill="none"/>
  <ellipse cx="420" cy="400" rx="100" ry="30" fill="#dcc9a8" stroke="#145239" stroke-width="4"/>
  <ellipse cx="420" cy="120" rx="70" ry="18" fill="#d7e8de" stroke="#2f8f65" stroke-width="2"/>
  <line x1="350" y1="90" x2="490" y2="90" stroke="#c45c26" stroke-width="3"/>
  <text x="420" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#14201a">Inside diameter</text>
  <line x1="560" y1="120" x2="560" y2="400" stroke="#c45c26" stroke-width="3"/>
  <text x="600" y="270" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#14201a">Height</text>
  <text x="480" y="480" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#145239">Sonotube / round form</text>
</svg>
